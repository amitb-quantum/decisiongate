[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "decisiongate"
version = "0.1.0"
description = "A falsification-first adjudication framework for LLM-assisted decisions"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "DecisionGate contributors" }]
keywords = ["decision-making", "falsification", "llm", "provenance"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "pydantic>=2.7,<3",
  "pypdf>=5,<7",
  "rich>=13.7,<15",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
openai = ["openai>=1.52,<3"]
dev = ["pytest>=8,<10"]

[project.scripts]
decisiongate = "decisiongate.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/decisiongate"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
